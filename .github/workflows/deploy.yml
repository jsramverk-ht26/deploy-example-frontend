name: Deploy to GitHub Pages

on:
  push:
    # Under projektet (vecka 6-10) arbetar ni i en dev-branch. Utan dev här
    # skulle den driftsatta sidan stå kvar på vecka 5-koden hela projektet,
    # eftersom inget mergas till main förrän vid inlämningen.
    #
    #   dev  = det som körs och demonstreras under projektet
    #   main = den släppta versionen
    #
    # Obs: Pages har bara EN publicerad version. Pushar ni till båda brancherna
    # är det den senaste deployen som ligger uppe.
    branches: [main, dev]

  # Gör att workflowet kan köras manuellt från Actions-fliken
  workflow_dispatch:

# Rättigheter som actions/deploy-pages behöver
permissions:
  contents: read
  pages: write
  id-token: write

# Kör en deploy i taget. Avbryt inte en pågående — då kan Pages hamna
# i ett halvfärdigt läge.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bygg produktionsbygget
        run: npm run build
        env:
          # VITE_API_URL bakas in i JS-bundlen HÄR, vid bygget.
          #
          # Den är en repository VARIABLE (vars), inte en secret. Allt som börjar
          # med VITE_ hamnar i den färdiga JS-filen och går att läsa för vem som
          # helst som öppnar sidan — det är alltså ingen hemlighet, och att lägga
          # den som secret ger en falsk trygghet.
          #
          # Sätts under: Settings -> Secrets and variables -> Actions -> Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Ladda upp bygget som Pages-artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
